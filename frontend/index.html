<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Watch Your AI Code</title>
    <script>
      // Set the theme before first paint so light-mode users don't get a dark
      // flash while the bundle loads. Same resolution as theme.ts (stored
      // choice, else OS preference); theme.ts keeps tracking OS changes after.
      (function () {
        var stored = localStorage.getItem("wyac.theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
