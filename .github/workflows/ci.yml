name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: frontend + backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build (tsc typecheck + vite)
        working-directory: frontend
        run: npm run build
      # The frontend suite covers things tsc cannot: the two routing rules that
      # each shipped as a bug once, and the summaries-fetch gate. It ran only in
      # `make check` until now, so every PR was green without it.
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
      - name: gofmt
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: go test
        working-directory: backend
        run: go test ./...
      - name: go build
        working-directory: backend
        run: go build ./...
